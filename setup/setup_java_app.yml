---
- name: Deploy App on RHEL
  hosts: all
  become: true
  vars:
    app_port: "80"
    app_name: "tasks-app"
    app_image: "docker.io/tiangolo/uvicorn-gunicorn"
 
  tasks:
  - name: Install podman and firewalld packages
    ansible.builtin.package:
      name:
        - podman
        - firewalld
      state: present
  
  - name: Deploy application using podman
    containers.podman.podman_container:
      name: "{{ app_name }}"
      image: "{{ app_image }}"
      state: started
      ports:
        - "{{ app_port }}:{{ app_port }}"

  - name: Enable firewald service to start on boot up
    ansible.builtin.systemd:
      name: firewalld
      state: started
      enabled: true
    
  - name: Create firewall rule for application
    ansible.posix.firewalld:
      port: "{{ app_port }}/tcp"
      permanent: true
      state: enabled
      immediate: true
      
  - name: Print the gateway for each host when defined
    ansible.builtin.debug:
      msg: "The application can be accessed on this url http://{{ public_dns_name }}:{{ app_port }}"
