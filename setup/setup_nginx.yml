---
# Installs Nginx and starts it as a systemd service.
# The role checks: systemd service 'nginx' active + enabled.
#
# Usage:
#   ansible-playbook test_setup/setup_nginx.yml -i <host>, -u <user> --ask-become-pass

- name: Set up Nginx
  hosts: all
  gather_facts: true
  become: true

  tasks:
    - name: Install nginx (RHEL family)
      ansible.builtin.dnf:
        name: nginx
        state: present
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Install nginx (Debian / Ubuntu)
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
      when: ansible_facts['os_family'] == 'Debian'

    - name: Enable and start nginx
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true
