---
# All check categories are disabled by default.
# Set the corresponding _enabled flag to true to activate a category.
#
# ── Retry / timing ────────────────────────────────────────────────────────────
# How many times to retry each check before failing (useful right after a reboot)
health_check_retries: 5
# Seconds to wait between retries
health_check_delay: 10

# ── System / OS state checks ──────────────────────────────────────────────────
# Set to true to enable system-level checks (uptime, kernel, disk, pending reboot)
health_check_system_enabled: false

# Assert uptime is below this many seconds (verifies a reboot occurred).
# Set to the maintenance window duration in seconds; 0 disables this check.
# Example: 3600 asserts the system rebooted within the last hour.
health_check_system_max_uptime_seconds: 0

# Expected kernel version string from `uname -r`. Empty string disables the check.
# Capture the value with `uname -r` after applying the patch.
# Example: "5.14.0-427.13.1.el9_4.x86_64"
health_check_system_expected_kernel: ""

# Minimum free disk space percentage on each listed mount point.
health_check_system_disk_min_free_percent: 15

# Mount points to check for free disk space. Empty list disables disk checks.
# Example: ["/", "/boot", "/var"]
health_check_system_disk_check_mounts: []

# Check whether a secondary reboot is still required after patching.
# On Debian/Ubuntu this tests for /var/run/reboot-required.
# On RHEL/CentOS this runs `needs-restarting -r`.
health_check_system_check_pending_reboot: false

# ── Application checks ────────────────────────────────────────────────────────
# Set to true to enable application checks
health_check_applications_enabled: false

# List of applications to verify. Each entry supports:
#   name       (required) human-readable label
#   process    (optional) process name to look for in `pgrep` output
#   pid_file   (optional) path to a PID file that must exist and hold a live PID
#   port       (optional) TCP port that must be listening (checked with ss/netstat)
#   url        (optional) HTTP/HTTPS URL that must return a 2xx status
#   url_status (optional, default 200) expected HTTP status code
#
# Example:
#   health_check_applications:
#     - name: My Web App
#       process: gunicorn
#       port: 8080
#       url: "http://localhost:8080/health"
#     - name: Redis
#       process: redis-server
#       port: 6379
health_check_applications: []

# ── Service checks ────────────────────────────────────────────────────────────
# Set to true to enable service checks
health_check_services_enabled: false

# List of systemd services that must be active.
# Each entry:
#   name     (required) systemd unit name (e.g. nginx, sshd, crond)
#   enabled  (optional, default true) when true, also assert the service is
#            enabled at boot; set to false to skip that assertion
#
# Example:
#   health_check_services:
#     - name: nginx
#     - name: sshd
#     - name: firewalld
#       enabled: false     # only assert running; skip the is-enabled-at-boot check
health_check_services: []

# ── Container / Pod checks ───────────────────────────────────────────────────
# Set to true to enable container / pod checks
health_check_containers_enabled: false

# List of containers or pods to verify. Each entry supports:
#   name       (required) container or pod name
#   runtime    (optional, default "auto") "podman", "docker", or "auto"
#              "auto" uses podman when available, docker otherwise
#   type       (optional, default "container") "container" or "pod"
#              "pod" is podman-only and uses `podman pod inspect`
#
# Example:
#   health_check_containers:
#     - name: my-web-app
#     - name: nginx
#       runtime: docker
#     - name: my-pod
#       runtime: podman
#       type: pod
health_check_containers: []

# ── PostgreSQL checks ─────────────────────────────────────────────────────────
# Set to true to enable PostgreSQL checks
health_check_postgresql_enabled: false

# OS user used to run psql commands (pg_isready, psql)
health_check_postgresql_os_user: postgres

# PostgreSQL host / port
health_check_postgresql_host: localhost
health_check_postgresql_port: 5432

# Optional: list of databases that must exist
#   health_check_postgresql_databases:
#     - myappdb
#     - anotherdb
health_check_postgresql_databases: []

# Optional: simple connectivity + write-read test executed inside each database.
# Set to true to run a CREATE / SELECT / DROP of a temporary table.
health_check_postgresql_run_rw_test: false

# Minimum acceptable PostgreSQL version (leave empty to skip version check)
# Example: "14"
health_check_postgresql_min_version: ""

# Maximum replication lag in bytes allowed before the check fails (0 = skip).
# Only meaningful on a primary with active standbys.
health_check_postgresql_max_replication_lag_bytes: 0

# ── Filesystem checks ─────────────────────────────────────────────────────────
# Set to true to enable filesystem checks (mounts, LVM, RAID)
health_check_filesystem_enabled: false

# List of mount points that must be present. Each entry is a path string.
# Example: ["/mnt/data", "/mnt/backup"]
health_check_filesystem_check_mounts: []

# Check LVM volume group health with `vgs` (requires lvm2 package on the host)
health_check_filesystem_check_lvm: false

# Check mdadm software RAID arrays for degraded state via /proc/mdstat
health_check_filesystem_check_raid: false

# ── Log / journal checks ──────────────────────────────────────────────────────
# Set to true to enable log scanning checks
health_check_log_enabled: false

# Scan systemd journal for priority 3 and above (errors/criticals) in the
# current boot. Findings are reported as a warning by default.
health_check_log_journal_errors: false

# Set to true to fail the play when journal errors are detected.
# Default false: errors are reported but do not fail the play.
health_check_log_fail_on_journal_errors: false

# Custom patterns to search for in the current boot journal using --grep.
# Each entry is a regex string. Matches are always reported as warnings.
# Example: ["segfault", "OOM killer", "kernel panic"]
health_check_log_patterns: []
