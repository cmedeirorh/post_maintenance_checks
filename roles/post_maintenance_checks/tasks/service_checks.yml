---
- name: Service checks | assert service is active
  ansible.builtin.command:
    cmd: "systemctl is-active {{ svc.name }}"
  register: _svc_active_result
  retries: "{{ health_check_retries | int }}"
  delay: "{{ health_check_delay | int }}"
  until: _svc_active_result.rc == 0
  changed_when: false
  failed_when: _svc_active_result.rc != 0
  loop: "{{ health_check_services }}"
  loop_control:
    loop_var: svc
    label: "{{ svc.name }}"

- name: Service checks | assert service is enabled at boot
  ansible.builtin.command:
    cmd: "systemctl is-enabled {{ svc.name }}"
  register: _svc_enabled_result
  retries: "{{ health_check_retries | int }}"
  delay: "{{ health_check_delay | int }}"
  until: _svc_enabled_result.rc == 0
  changed_when: false
  failed_when: _svc_enabled_result.rc != 0
  loop: "{{ health_check_services }}"
  loop_control:
    loop_var: svc
    label: "{{ svc.name }}"
  when: svc.enabled | default(true) | bool
