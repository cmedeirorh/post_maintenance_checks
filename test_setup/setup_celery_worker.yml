---
# Deploys a minimal Celery worker sample backed by Redis.
# All worker and service content is embedded here — nothing to build.
# The role checks: pgrep -x celery.
#
# Prerequisite: Redis running (setup_redis.yml).
#
# Usage:
#   ansible-playbook test_setup/setup_celery_worker.yml -i <host>, -u <user> --ask-become-pass

- name: Set up Celery worker
  hosts: all
  gather_facts: true
  become: true

  vars:
    worker_dir: /opt/test_env/celery_worker

  handlers:
    - name: Restart celery_worker
      ansible.builtin.systemd:
        name: celery_worker
        state: restarted
        daemon_reload: true

  tasks:
    - name: Install python3 and pip (RHEL family)
      ansible.builtin.dnf:
        name:
          - python3
          - python3-pip
        state: present
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Install python3 and pip (Debian / Ubuntu)
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - python3-venv
        state: present
        update_cache: true
      when: ansible_facts['os_family'] == 'Debian'

    - name: Create worker directory
      ansible.builtin.file:
        path: "{{ worker_dir }}"
        state: directory
        mode: "0755"

    - name: Write worker.py
      ansible.builtin.copy:
        dest: "{{ worker_dir }}/worker.py"
        mode: "0644"
        content: |
          from celery import Celery

          app = Celery(
              "worker",
              broker="redis://localhost:6379/0",
              backend="redis://localhost:6379/0",
          )

          @app.task
          def add(x, y):
              return x + y

    - name: Install celery and redis into virtualenv
      ansible.builtin.pip:
        name:
          - "celery>=5.3"
          - "redis>=5.0"
        virtualenv: "{{ worker_dir }}/venv"
        virtualenv_command: python3 -m venv

    - name: Write celery_worker systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/celery_worker.service
        mode: "0644"
        content: |
          [Unit]
          Description=Celery Worker (post_maintenance_checks test)
          After=network.target redis.service

          [Service]
          Type=simple
          WorkingDirectory={{ worker_dir }}
          ExecStart={{ worker_dir }}/venv/bin/celery -A worker worker --loglevel=info
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify: Restart celery_worker

    - name: Enable and start celery_worker
      ansible.builtin.systemd:
        name: celery_worker
        state: started
        enabled: true
        daemon_reload: true
